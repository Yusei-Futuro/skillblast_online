<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Skill Blast TCG - Online Oficial</title>
  <!-- PeerJS para conexión directa P2P -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131b2e;
      --card-char: #1e3a8a;
      --card-skill: #b45309;
      --card-generic: #047857;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text: #f1f5f9;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Lobby */
    #screen-lobby {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 100;
    }
    .lobby-box {
      background: var(--panel); padding: 24px; border-radius: 12px;
      border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 12px; width: 320px; text-align: center;
    }
    input[type="text"] {
      padding: 10px; border-radius: 6px; border: 1px solid #334155;
      background: #090d16; color: #fff; text-align: center; font-weight: bold; letter-spacing: 2px;
    }
    button {
      background: var(--accent); color: #090d16; font-weight: bold;
      border: none; padding: 10px; border-radius: 6px; cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }

    /* Modal selector inicial */
    #modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; gap: 14px;
    }
    #modal-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-width: 860px;
      max-height: 72vh;
      overflow-y: auto;
      padding: 14px;
      background: rgba(19, 27, 46, 0.95);
      border-radius: 8px;
    }

    /* Tablero */
    #screen-board {
      flex: 1; display: none;
      flex-direction: column; justify-content: space-between; padding: 10px 16px;
      max-width: 1200px; margin: 0 auto; width: 100%;
    }
    .zone { background: var(--panel); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }

    .bench-tracker { display: flex; gap: 6px; align-items: center; }
    .bench-slot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #64748b; }
    .bench-slot.filled { background-color: var(--danger); border-color: var(--danger); }

    .field {
      display: flex; gap: 14px; min-height: 145px; justify-content: center; align-items: center;
      background: rgba(0, 0, 0, 0.3); border-radius: 6px; border: 1px dashed #334155; padding: 6px;
    }

    /* Cartas */
    .card {
      width: 110px; height: 150px; border-radius: 6px; padding: 6px;
      display: flex; flex-direction: column; justify-content: space-between; font-size: 0.7rem;
      position: relative; cursor: pointer; user-select: none; border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-4px); }
    .card.char { background: var(--card-char); border-color: #3b82f6; }
    .card.skill-exclusive { background: var(--card-skill); border-color: #f59e0b; }
    .card.skill-generic { background: var(--card-generic); border-color: #10b981; }

    .card-selected { border-color: var(--gold) !important; box-shadow: 0 0 10px var(--gold); transform: translateY(-8px); }
    .card.exhausted { opacity: 0.55; filter: grayscale(40%); }

    .skills-count {
      position: absolute; top: -6px; right: -6px; background: var(--gold);
      color: #000; font-weight: 800; border-radius: 50%; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }

    .tag-owner {
      background: rgba(0,0,0,0.4); padding: 2px 4px; border-radius: 3px;
      font-weight: bold; color: #fed7aa; font-size: 0.65rem; text-align: center;
    }

    .hand { display: flex; gap: 8px; min-height: 120px; align-items: center; overflow-x: auto; }
    .hand .card { height: 130px; width: 100px; }

    .controls {
      display: flex; justify-content: space-between; align-items: center;
      background: #0b1120; padding: 8px 14px; border-radius: 6px; border: 1px solid #1e293b;
    }
    #log-text { font-size: 0.85rem; color: #cbd5e1; flex: 1; }

    /* Chat flotante */
    #chat-container {
      position: fixed; bottom: 20px; right: 20px; width: 280px; height: 320px;
      background: #111827; border: 1px solid #374151; border-radius: 10px;
      display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.6); z-index: 40;
    }
    #chat-container.collapsed { height: 38px; overflow: hidden; }
    #chat-header {
      background: #1f2937; padding: 8px 12px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.8rem;
    }
    #chat-messages { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; }
    .chat-bubble { padding: 4px 8px; border-radius: 6px; max-width: 85%; word-break: break-word; }
    .chat-bubble.mine { background: var(--card-char); align-self: flex-end; color: #fff; }
    .chat-bubble.theirs { background: #374151; align-self: flex-start; color: #e5e7eb; }
    #chat-input-bar { padding: 6px; display: flex; gap: 4px; border-top: 1px solid #1f2937; }
    #chat-input { flex: 1; padding: 4px 8px; border-radius: 4px; border: 1px solid #4b5563; background: #1f2937; color: #fff; text-align: left; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LOBBY -->
  <div id="screen-lobby">
    <h1>Skill Blast TCG</h1>
    <div class="lobby-box">
      <button onclick="clickCrearPartida()">Crear Partida</button>
      <hr style="border-color: #334155;">
      <input type="text" id="room-code-input" placeholder="CÓDIGO SALA" maxlength="6">
      <button onclick="clickUnirse()">Unirse a Partida</button>
      <div id="lobby-status" style="font-size: 0.8rem; color: #94a3b8;">Elige una opción</div>
    </div>
  </div>

  <!-- MODAL: SELECCIONAR PERSONAJE INICIAL -->
  <div id="modal">
    <h2>Elige tu Personaje Inicial</h2>
    <div id="modal-cards"></div>
  </div>

  <!-- PANTALLA 2: TABLERO -->
  <div id="screen-board">
    <div style="background:#1e293b; padding:6px 12px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
      <span id="room-display" style="color:var(--gold); font-weight:bold;">Conectando...</span>
      <span id="rival-status" style="color:var(--danger); font-size:0.85rem;">Esperando rival...</span>
    </div>

    <!-- Oponente -->
    <div class="zone">
      <div class="header-bar">
        <span><strong>Oponente</strong> (Mazo: <span id="e-deck-count">0</span> | Cementerio: <span id="e-grave-count">0</span>)</span>
        <div class="bench-tracker">
          <span>Banca:</span>
          <div class="bench-slot" id="e-bench-0"></div>
          <div class="bench-slot" id="e-bench-1"></div>
          <div class="bench-slot" id="e-bench-2"></div>
        </div>
      </div>
      <div class="field" id="enemy-field">
        <span style="color:#64748b; font-size:0.8rem;">Esperando despliegue enemigo...</span>
      </div>
    </div>

    <!-- Centro -->
    <div class="controls">
      <div id="log-text">Cargando partida...</div>
      <div>
        <span id="turn-indicator" style="margin-right: 12px; font-weight: bold;"></span>
        <button id="end-turn-btn" onclick="endTurn()" disabled>Terminar Turno</button>
      </div>
    </div>

    <!-- Jugador -->
    <div class="zone">
      <div class="field" id="player-field"></div>
      <div class="header-bar">
        <span><strong>Tu Mano</strong> (Mazo: <span id="p-deck-count">0</span> | Cementerio: <span id="p-grave-count">0</span>)</span>
        <div class="bench-tracker">
          <span>Banca:</span>
          <div class="bench-slot" id="p-bench-0"></div>
          <div class="bench-slot" id="p-bench-1"></div>
          <div class="bench-slot" id="p-bench-2"></div>
        </div>
      </div>
      <div class="hand" id="player-hand"></div>
    </div>
  </div>

  <!-- Chat flotante -->
  <div id="chat-container">
    <div id="chat-header" onclick="toggleChat()">
      <span>💬 Chat</span>
      <span id="chat-toggle-icon">−</span>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Mensaje..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button onclick="sendChatMessage()">Enviar</button>
    </div>
  </div>

<script>
  // --- BASE DE DATOS COMPLETA DE SKILL BLAST TCG ---
  const OFFICIAL_DATABASE = [
    // PERSONAJES
    { id: 1, name: "Haruka", type: "character", desc: "Si no porta Skill: roba 1 carta.", archetype: "Haruka" },
    { id: 3, name: "Marina", type: "character", desc: "Pon 1 carta de mano en fondo de deck: roba 1.", archetype: "Marina" },
    { id: 5, name: "Roy", type: "character", desc: "Envía las 2 primeras cartas del deck al cementerio.", archetype: "Roy" },
    { id: 7, name: "Katshi", type: "character", desc: "Al destruirse en batalla: busca 1 Katshi en el deck.", archetype: "Katshi" },
    { id: 9, name: "Tagero", type: "character", desc: "Revela 5 del deck: toma ¡Explosión trueno! reveladas.", archetype: "Tagero" },
    { id: 11, name: "Sophia", type: "character", desc: "(2+ Skills) Equipa Control del pensar desde el deck.", archetype: "Sophia" },
    { id: 13, name: "Bao", type: "character", desc: "(3+ Skills) Mira mano rival y envía 1 al cementerio.", archetype: "Bao" },
    { id: 80, name: "Katherine", type: "character", desc: "Al destruirse en batalla: envía 1 carta elegida del deck al cementerio.", archetype: "Katherine" },
    { id: 91, name: "Deida", type: "character", desc: "(1+ Skills) Equipa 1 Skill propia de Deida del cementerio.", archetype: "Deida" },
    { id: 99, name: "Helica", type: "character", desc: "En banca: revela 3 del deck, si hay Personaje a la mano.", archetype: "Helica" },
    { id: 119, name: "Nara", type: "character", desc: "(1+ Skills) Añade 1 Ryu-chan del deck a la mano.", archetype: "Nara" },
    { id: 120, name: "Ryu-chan", type: "character", desc: "Al jugarse de mano con Nara en campo: roba 2 cartas.", archetype: "Ryu-chan" },
    { id: 157, name: "Nobuko", type: "character", desc: "Al final de turno rival, si tiene 4+ cartas: descártala y rival baraja mano.", archetype: "Nobuko" },
    { id: 166, name: "Fredlard", type: "character", desc: "Al final de turno rival: descártala y ambos roban 1 carta.", archetype: "Fredlard" },
    { id: 270, name: "Lyna", type: "character", desc: "(1+ Skills) Una vez por turno: envía 1 Skill portada al cementerio.", archetype: "Lyna" },
    { id: 275, name: "Eishet", type: "character", desc: "Revela 3 del tope: si hay Skill propia de Eishet, agrégala a mano.", archetype: "Eishet" },
    { id: 280, name: "Chiako", type: "character", desc: "En banca: rival coloca 1 carta de mano en fondo de deck.", archetype: "Chiako" },

    // SKILLS DE PERSONAJE
    { id: 2, name: "Muro de hielo", type: "skill", owner: "Marina", desc: "+1 Vida. 1ra vez por turno no es destruido en batalla." },
    { id: 4, name: "Ataque destello", type: "skill", owner: "Haruka", desc: "+1 Vida. Permite realizar hasta 2 ataques en el turno." },
    { id: 12, name: "Control del pensar", type: "skill", owner: "Sophia", desc: "+1 Vida. Envía al cementerio 1 Skill de un enemigo." },
    { id: 21, name: "¡Explosión trueno!", type: "skill", owner: "Tagero", desc: "+1 Vida. Al romperse en batalla: realiza otro ataque." },
    { id: 28, name: "¡Splash!", type: "skill", owner: "Marina", desc: "+1 Vida. Al romperse en batalla: roba 1 carta." },
    { id: 38, name: "Cambio de fuego", type: "skill", owner: "Roy", desc: "+1 Vida. Si cae al cementerio desde el deck: roba 2 cartas." },
    { id: 39, name: "Ráfaga siniestra", type: "skill", owner: "Katshi", desc: "+1 Vida. Permite realizar hasta 2 ataques en este turno." },
    { id: 76, name: "Analizar combate", type: "skill", owner: "Bao", desc: "+1 Vida. Revela 3 del tope: toma 1 a mano y baraja el resto." },
    { id: 94, name: "Firewall", type: "skill", owner: "Katherine", desc: "+1 Vida. Al caer al cem.: añade 1 Katherine de deck a mano." },
    { id: 104, name: "Resguardo sagrado", type: "skill", owner: "Deida", desc: "+1 Vida. Inmune a ser enviada al cementerio por efectos rivales." },
    { id: 122, name: "Drago-refugio", type: "skill", owner: "Nara", desc: "+1 Vida. Mientras controles a Ryu-chan, este personaje no puede ser atacado." },
    { id: 121, name: "¡Drago-impacto!", type: "skill", owner: "Ryu-chan", desc: "+1 Vida. Con Nara en campo: destruye 2 Skills portadas." },
    { id: 214, name: "Labor de sirvienta", type: "skill", owner: "Nobuko", desc: "+1 Vida. Añade 1 Skill propia de Nobuko de deck a mano." },
    { id: 271, name: "Vendaval tajante", type: "skill", owner: "Lyna", desc: "+1 Vida. Al enviarse al cem. por efecto: destruye 2 Skills." },
    { id: 272, name: "¡Desenvainar!", type: "skill", owner: "Lyna", desc: "+1 Vida. Al enviarse al cem. por efecto: roba 2 cartas." },
    { id: 277, name: "¡Invocar!", type: "skill", owner: "Eishet", desc: "+1 Vida. Mándala al cem.: toma 1 Personaje del tope." },
    { id: 282, name: "Ultra conexión", type: "skill", owner: "Chiako", desc: "+1 Vida. Adivina tipo: rival revela carta inferior y roba 2." },

    // SKILLS GENERALES
    { id: 6, name: "¡Boom!", type: "skill", owner: null, desc: "+1 Vida. Si cae al cementerio desde el deck: va a la mano." },
    { id: 8, name: "¡Voluntad!", type: "skill", owner: null, desc: "+1 Vida. Si solo controlas 1 Personaje: roba 1 carta." },
    { id: 10, name: "Investigación", type: "skill", owner: null, desc: "+1 Vida. Revela 5: si hay Investigación, equípala." },
    { id: 15, name: "Al borde", type: "skill", owner: null, desc: "+1 Vida. Si se envía desde mano al cem.: equípala a un Personaje." },
    { id: 22, name: "Desechos", type: "skill", owner: null, desc: "+1 Vida. Al romperse en batalla: recupera 1 Personaje de cem. a mano." },
    { id: 45, name: "¡Inmovilizar!", type: "skill", owner: null, desc: "+1 Vida. Bloquea agregar cartas a mano por Skills." },
    { id: 60, name: "Resistir", type: "skill", owner: null, desc: "+1 Vida. Cuando el rival ataca: equípala directo desde mano." },
    { id: 141, name: "Papas", type: "skill", owner: null, desc: "+1 Vida. Si se envía al cementerio por batalla: ponla en tope de deck." }
  ];

  let peer = null;
  let conn = null;
  let isMyTurn = false;
  let turnNumber = 1;
  let selectedHandCard = null;
  let selectedAttacker = null;

  const myState = { deck: [], hand: [], field: [], graveyard: [], bench: 0 };
  const oppState = { deckCount: 26, handCount: 3, field: [], graveyard: [], bench: 0 };

  // --- LOBBY Y P2P ---
  function clickCrearPartida() {
    document.getElementById('screen-lobby').style.display = 'none';
    document.getElementById('screen-board').style.display = 'flex';

    const code = Math.floor(10000 + Math.random() * 90000).toString();
    document.getElementById('room-display').innerHTML = `Código de Sala: <u>${code}</u>`;

    initDeck();
    showStarterModal();

    isMyTurn = true;
    peer = new Peer("SB-" + code);
    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
      document.getElementById('rival-status').innerHTML = "🟢 Conectado";
      document.getElementById('rival-status').style.color = "var(--accent)";
      document.getElementById('end-turn-btn').disabled = false;
      sync();
    });
  }

  function clickUnirse() {
    const code = document.getElementById('room-code-input').value.trim();
    if (!code) return alert("Escribe el código de sala.");

    document.getElementById('screen-lobby').style.display = 'none';
    document.getElementById('screen-board').style.display = 'flex';
    document.getElementById('room-display').textContent = `Conectando a sala ${code}...`;

    initDeck();
    showStarterModal();

    isMyTurn = false;
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect("SB-" + code);
      setupConnection();
      conn.on('open', () => {
        document.getElementById('room-display').textContent = `Sala: ${code}`;
        document.getElementById('rival-status').innerHTML = "🟢 Conectado";
        document.getElementById('rival-status').style.color = "var(--accent)";
        sync();
      });
    });
  }

  function setupConnection() {
    conn.on('data', (data) => {
      if (data.type === 'SYNC') {
        oppState.field = data.field;
        oppState.graveyard = data.graveyard;
        oppState.bench = data.bench;
        oppState.deckCount = data.deckCount;
        render();
        checkWinner();
      } else if (data.type === 'ACTION_ATTACK') {
        resolveCombat(myState, data.targetIdx);
        sync();
        render();
        checkWinner();
      } else if (data.type === 'END_TURN') {
        isMyTurn = true;
        turnNumber++;
        draw(myState);
        myState.field.forEach(c => c.canAttack = true);
        document.getElementById('end-turn-btn').disabled = false;
        sync();
        render();
      } else if (data.type === 'CHAT') {
        appendChatMessage(data.text, 'theirs');
      }
    });
  }

  function sync() {
    if (conn && conn.open) {
      conn.send({
        type: 'SYNC',
        field: myState.field,
        graveyard: myState.graveyard,
        bench: myState.bench,
        deckCount: myState.deck.length
      });
    }
  }

  // --- LÓGICA DE PARTIDA ---
  function initDeck() {
    myState.deck = [];
    const chars = OFFICIAL_DATABASE.filter(c => c.type === 'character');
    const skills = OFFICIAL_DATABASE.filter(c => c.type === 'skill');

    for (let i = 0; i < 10; i++) myState.deck.push({ ...chars[i % chars.length], uid: Math.random() });
    for (let i = 0; i < 20; i++) myState.deck.push({ ...skills[i % skills.length], uid: Math.random() });
    myState.deck.sort(() => Math.random() - 0.5);
  }

  function showStarterModal() {
    const modal = document.getElementById('modal');
    const container = document.getElementById('modal-cards');
    modal.style.display = 'flex';
    container.innerHTML = '';

    const characters = OFFICIAL_DATABASE.filter(c => c.type === 'character');

    characters.forEach(char => {
      const card = document.createElement('div');
      card.className = 'card char';
      card.innerHTML = `<strong>${char.name}</strong><p style="font-size:0.65rem;">${char.desc}</p>`;
      card.onclick = () => {
        myState.field.push({ name: char.name, skills: [], canAttack: false });
        modal.style.display = 'none';

        // 3 cartas iniciales
        for (let i = 0; i < 3; i++) draw(myState);

        setLog(isMyTurn ? "Turno 1: Es tu turno (Sin ataques posibles)." : "Turno del oponente...");
        render();
        sync();
      };
      container.appendChild(card);
    });
  }

  function draw(entity) {
    if (entity.deck.length > 0) entity.hand.push(entity.deck.pop());
  }

  function setLog(msg) {
    document.getElementById('log-text').innerHTML = msg;
  }

  function selectHandCard(index) {
    if (!isMyTurn) return;
    const card = myState.hand[index];

    if (card.type === "character") {
      if (myState.field.length >= 3) return setLog("Límite: Máximo 3 personajes en campo.");
      myState.field.push({ ...card, skills: [], canAttack: turnNumber > 1 });
      myState.hand.splice(index, 1);
      selectedHandCard = null;
      sync();
      render();
      return;
    }

        if (card.type === "skill") {
      selectedHandCard = (selectedHandCard === index) ? null : index;
      render();
    }
  }

  function clickMyField(charIndex) {
    if (selectedHandCard !== null) {
      const skill = myState.hand[selectedHandCard];
      const targetChar = myState.field[charIndex];

      if (skill.owner && skill.owner !== targetChar.name) {
        return setLog(`Restricción: Esta skill solo puede ser portada por ${skill.owner}.`);
      }

      targetChar.skills.push(skill);
      myState.hand.splice(selectedHandCard, 1);
      selectedHandCard = null;
      sync();
      render();
      return;
    }

    if (!isMyTurn || turnNumber === 1) return setLog("No se puede atacar en el turno 1.");
    const char = myState.field[charIndex];
    if (!char.canAttack) return;

    selectedAttacker = (selectedAttacker === charIndex) ? null : charIndex;
    render();
  }

  function clickOpponentField(oppIndex) {
    if (selectedAttacker === null) return;

    resolveCombat(myState, selectedAttacker);
    conn.send({ type: 'ACTION_ATTACK', targetIdx: oppIndex });

    selectedAttacker = null;
    sync();
    checkWinner();
    render();
  }

  function resolveCombat(stateObj, index) {
    const char = stateObj.field[index];
    if (!char) return;

    if (char.skills.length > 0) {
      const broken = char.skills.pop();
      stateObj.graveyard.push(broken);
      char.canAttack = false;
      if (broken.name.includes("¡Splash!") || broken.name.includes("¡Desenvainar!")) {
        draw(stateObj);
      }
    } else {
      stateObj.field.splice(index, 1);
      stateObj.bench++;
      draw(stateObj);
    }
  }

  function endTurn() {
    if (!isMyTurn) return;
    isMyTurn = false;
    selectedHandCard = null;
    selectedAttacker = null;
    document.getElementById('end-turn-btn').disabled = true;

    conn.send({ type: 'END_TURN' });
    sync();
    render();
    setLog("Turno del oponente...");
  }

  function checkWinner() {
    if (myState.bench >= 3) {
      alert("¡Derrota! 3 de tus personajes fueron a la banca.");
      location.reload();
    } else if (oppState.bench >= 3) {
      alert("¡Victoria! Enviaste a la banca a 3 personajes rivales.");
      location.reload();
    }
  }

  function render() {
    document.getElementById('p-deck-count').textContent = myState.deck.length;
    document.getElementById('p-grave-count').textContent = myState.graveyard.length;
    document.getElementById('e-deck-count').textContent = oppState.deckCount;
    document.getElementById('e-grave-count').textContent = oppState.graveyard.length;
    document.getElementById('turn-indicator').textContent = isMyTurn ? "Tu Turno" : "Turno Rival";

    for (let i = 0; i < 3; i++) {
      document.getElementById(`p-bench-${i}`).className = `bench-slot ${i < myState.bench ? 'filled' : ''}`;
      document.getElementById(`e-bench-${i}`).className = `bench-slot ${i < oppState.bench ? 'filled' : ''}`;
    }

    // Tu Campo
    const pField = document.getElementById('player-field');
    pField.innerHTML = '';
    myState.field.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = `card char ${selectedAttacker === idx ? 'card-selected' : ''}`;
      card.innerHTML = `<div class="skills-count">${c.skills.length}</div><strong>${c.name}</strong>`;
      card.onclick = () => clickMyField(idx);
      pField.appendChild(card);
    });

    // Campo Oponente
    const eField = document.getElementById('enemy-field');
    eField.innerHTML = '';
    oppState.field.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = 'card char';
      card.innerHTML = `<div class="skills-count">${c.skills.length}</div><strong>${c.name}</strong>`;
      card.onclick = () => clickOpponentField(idx);
      eField.appendChild(card);
    });

    // Tu Mano
    const pHand = document.getElementById('player-hand');
    pHand.innerHTML = '';
    myState.hand.forEach((c, idx) => {
      const card = document.createElement('div');
      const typeClass = c.type === 'character' ? 'char' : (c.owner ? 'skill-exclusive' : 'skill-generic');
      card.className = `card ${typeClass} ${selectedHandCard === idx ? 'card-selected' : ''}`;
      card.innerHTML = `<strong>${c.name}</strong><p>${c.desc}</p>${c.owner ? `<div class="tag-owner">${c.owner}</div>` : ''}`;
      card.onclick = () => selectHandCard(idx);
      pHand.appendChild(card);
    });
  }

  // --- CHAT FLOTANTE ---
  function toggleChat() {
    const chat = document.getElementById('chat-container');
    chat.classList.toggle('collapsed');
    document.getElementById('chat-toggle-icon').textContent = chat.classList.contains('collapsed') ? '+' : '−';
  }

  function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !conn || !conn.open) return;

    conn.send({ type: 'CHAT', text: text });
    appendChatMessage(text, 'mine');
    input.value = '';
  }

  function appendChatMessage(text, sender) {
    const container = document.getElementById('chat-messages');
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${sender}`;
    bubble.textContent = text;
    container.appendChild(bubble);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
